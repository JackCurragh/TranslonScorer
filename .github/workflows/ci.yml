name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y samtools libbz2-dev zlib1g-dev liblzma-dev libcurl4-openssl-dev

      - name: Install package
        run: |
          python -m pip install --upgrade pip build
          pip install -e '.[full]'

      - name: Build package
        run: python -m build

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: pytest -q -n auto

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: pytest -n auto --cov=TranslonScorer --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip mypy
          pip install -e '.[full]'

      # Report-only while the codebase is alpha; tighten to fail-on-error
      # (drop `|| true`) before the 1.0 release to match RiboMetric.
      - name: Run mypy (report-only)
        run: mypy --config-file mypy.ini TranslonScorer || true
