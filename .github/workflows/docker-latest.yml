name: Build and Push Docker (latest)

on:
  push:
    branches: [ "main" ]
    paths:
      # Repo-root-relative. The old 'translonscorer/**' filter matched nothing
      # (this repo IS translonscorer), so this workflow never fired on a code
      # change.
      - 'TranslonScorer/**'
      - 'tests/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/docker-latest.yml'
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest
      # No `|| true`. The docker job needs: test, so swallowing the exit code
      # made this gate decorative — a failing suite would still publish.
      - name: Run tests
        run: pytest -q tests

  docker:
    name: Build and push latest
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: prep
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/translonscorer:latest
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.prep.outputs.image }}
