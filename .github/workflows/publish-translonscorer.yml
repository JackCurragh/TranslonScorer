name: publish-translonscorer

on:
  push:
    branches: [ main ]
    paths:
      - 'translonscorer/**'
      - '.github/workflows/publish-translonscorer.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-translonscorer
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/jackcurragh/translonscorer

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./translonscorer
          file: ./translonscorer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test built image
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} --help || true

