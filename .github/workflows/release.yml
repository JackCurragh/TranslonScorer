name: Release

# The single release path. Pushing a `vX.Y.Z` tag (which `bump2version`
# creates) produces, in this order and only if each step passes:
#
#   gate    -> the full CI gate, re-run on the tag (calls ci.yml; not a copy)
#   pypi    -> sdist + wheel to PyPI via Trusted Publishing (OIDC, no token)
#   image   -> ghcr.io/<owner>/translonscorer:vX.Y.Z, :X.Y and :latest
#   release -> a GitHub Release with the distributions attached
#
# `:latest` means "the most recent release" and is written here only. The tip
# of main is published as `:main` / `:sha-<short>` by ci.yml. Nothing else in
# the repo pushes a container tag.
#
# One-time PyPI setup is in docs/RELEASE.md §4 and is already done: the
# Trusted Publisher binding and the `pypi` environment are proven working (the
# v0.3.0 run authenticated successfully and failed only on a non-normalised
# wheel filename, which ci.yml's build job now asserts against).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/translonscorer

jobs:
  gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  pypi:
    name: Publish to PyPI
    needs: gate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      # Built once by the gate's `build` job; artifacts are shared across the
      # run, so the published bits are byte-identical to the ones CI checked.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  image:
    name: Publish release container
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # `latest` is applied only for a non-prerelease semver tag.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test built image
        run: docker run --rm "${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" --help

  release:
    name: GitHub Release
    needs: [pypi, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
