[build-system]
requires = ["setuptools<70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TranslonScorer"
version = "0.3.0"
description = "A CLI for scoring translational events from Ribo-seq data"
readme = "README.md"
# zarr>=3.1 (a core dep, for the zarr v3 matrix store) requires Python >=3.11,
# so the package requires 3.11+ despite being alpha.
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [ { name = "Jack Tierney", email = "jackcurragh@gmail.com" } ]
keywords = ["Ribo-seq", "translation", "ORF", "bioinformatics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

# Core runtime deps; heavy/optional ones are in extras below
dependencies = [
  "polars==1.36.1",
  "numpy>=1.26,<2",
  # pandas >=2.2.3 to satisfy oxbow>=0.5.1; pairs with numpy 1.26
  "pandas>=2.2.3,<2.3",
  "pyarrow==21.0.0",
  "pysam==0.22.1",
  "pyfaidx==0.8.1.1",
  "pyahocorasick==2.1.0",
  "pyranges==0.0.129",
  "click>=8.1.7,<9",
  "pyBigWig>=0.3.22",
  "oxbow==0.5.1",
  "setuptools<70",
  # Zarr v3 store compatibility (global_matrix.zarr uses zarr.json)
  "zarr>=3.1,<4",
  # numcodecs 0.16+ changed APIs; stay below 0.16
  "numcodecs>=0.12,<0.16",
]

[project.optional-dependencies]
bigwig = [
  "pyBigWig>=0.3.22",
]
zarr = [
  "zarr>=3.1,<4",
  "numcodecs>=0.12,<0.16",
]
viz = [
  "matplotlib==3.9.0",
  "plotly==5.22.0",
  "Jinja2==3.1.4",
]
fastbam = [
  "oxbow==0.5.1",
]
perf = [
  "psutil>=5.9",
  "memory-profiler==0.61.0",
]
cluster = [
  # matrix/clustering.py: homogeneous shape clustering (scipy linkage)
  "scipy>=1.11",
]
dev = [
  "pytest==8.2.0",
  "pytest-xdist>=3.5",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "black>=24.0",
  "mypy>=1.10",
  "build>=1.2",
  "twine>=5.0",
  "bump2version>=1.0",
]
full = [
  "TranslonScorer[bigwig, zarr, viz, fastbam, perf, cluster, dev]",
]

[project.urls]
Homepage = "https://github.com/JackCurragh/TranslonScorer"
Issues = "https://github.com/JackCurragh/TranslonScorer/issues"

[project.scripts]
translonscorer = "TranslonScorer.cli:cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["TranslonScorer", "TranslonScorer.*"]
exclude = ["data/*"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "(build|dist)/"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# Formatting (line length etc.) is black's job; ruff handles correctness +
# imports. E501 off (black wraps); F catches unused imports / undefined names.
select = ["E", "F", "W", "I"]
# E501 line length (black's job); E741 ambiguous names; E402 deliberate
# imports-after-code in re-export / conditional-import modules; E712 is a polars
# idiom (`pl.col(x) == True` is a boolean mask — `is True` would break it).
ignore = ["E501", "E741", "E402", "E712"]
